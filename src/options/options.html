<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cài đặt Mike-Autodownload</title>
    <link rel="stylesheet" href="../shared/styles.css">
  </head>
  <body>
    <main class="app-shell options-shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Mike-Autodownload</p>
          <h1>Cài đặt Mike-Autodownload</h1>
        </div>
        <div class="hero-buttons">
          <button id="langToggle" class="ghost icon-button" type="button" aria-label="Đổi ngôn ngữ" title="Đổi ngôn ngữ">EN</button>
          <button id="themeToggle" class="ghost icon-button" type="button" aria-label="Đổi giao diện" title="Đổi giao diện">🌓</button>
        </div>
      </section>
      <section class="panel">
        <div class="field-row">
          <label for="timeoutSeconds">Thời gian đợi mỗi link (giây)</label>
          <input id="timeoutSeconds" type="number" min="20" max="300" step="5" aria-describedby="timeoutHelp">
          <small id="timeoutHelp">Giá trị từ 20 đến 300 giây.</small>
        </div>
        <div class="field-row">
          <label for="downloadFolder">Thư mục con trong Downloads</label>
          <input id="downloadFolder" type="text">
        </div>
        <label class="check-row" for="folderPerChannel"><input id="folderPerChannel" type="checkbox"> Tách thư mục con theo kênh (Downloads/SO9-Downloads/&lt;tên kênh&gt;)</label>
        <label class="check-row" for="notifyEnabled"><input id="notifyEnabled" type="checkbox"> Thông báo Chrome khi xong danh sách</label>
        <button id="saveBtn" class="primary" type="button">Lưu cài đặt</button>
        <p id="saveStatus" class="save-status" role="status" aria-live="polite" aria-atomic="true"></p>
      </section>
      <section class="panel">
        <div class="section-title">
          <h2>Nguồn tải</h2>
          <button id="checkBackendsBtn" class="ghost" type="button">Kiểm tra nguồn tải</button>
        </div>
        <p class="save-status">Thứ tự dùng: trang gốc → SO9 → site dự phòng. Kiểm tra để biết site nào đang sống.</p>
        <div id="backendStatus" class="backend-status"></div>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
