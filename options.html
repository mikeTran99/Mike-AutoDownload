<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cài đặt Mike-Autodownload</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell options-shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Mike-Autodownload</p>
          <h1>Cài đặt Mike-Autodownload</h1>
        </div>
        <button id="themeToggle" class="ghost icon-button" type="button" aria-label="Đổi giao diện" title="Đổi giao diện">🌓</button>
      </section>
      <section class="panel">
        <div class="field-row">
          <label for="timeoutSeconds">Thời gian đợi mỗi link (giây)</label>
          <input id="timeoutSeconds" type="number" min="20" max="300" step="5" aria-describedby="timeoutHelp">
          <small id="timeoutHelp">Giá trị từ 20 đến 300 giây.</small>
        </div>
        <div class="field-row">
          <label for="downloadFolder">Thư mục con trong Downloads</label>
          <input id="downloadFolder" type="text">
        </div>
        <button id="saveBtn" class="primary" type="button">Lưu cài đặt</button>
        <p id="saveStatus" class="save-status" role="status" aria-live="polite" aria-atomic="true"></p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
