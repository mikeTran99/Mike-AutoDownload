name: Extension checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Syntax and safety contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run extension checks
        run: npm run check
